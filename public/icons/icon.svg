<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.15" />

  <!-- Center Decorative Glow -->
  <circle cx="256" cy="256" r="180" fill="#ffffff" fill-opacity="0.05" filter="blur(20px)" />

  <!-- Alef Character -->
  <g filter="url(#shadow)">
    <text x="256" y="340" font-family="'Assistant', 'Rubik', 'Segoe UI', sans-serif" font-size="280" font-weight="900" text-anchor="middle" fill="#ffffff">
      א
    </text>
  </g>

  <!-- Small Gold Star / Sparkle top-right -->
  <path d="M380 120 L386 138 L404 144 L386 150 L380 168 L374 150 L356 144 L374 138 Z" fill="url(#gold)" />
</svg>
